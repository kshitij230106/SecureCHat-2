<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="SecureChat – End-to-end encrypted private and group messaging over TCP.">
  <title>SecureChat – Secure Messaging</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body class="login-page">

  <div class="auth-container">

    <!-- ── Brand ─────────────────────────────────────── -->
    <div class="auth-brand">
      <div class="auth-brand-icon">🔐</div>
      <h1>SecureChat</h1>
      <p>End-to-end encrypted · TCP Network · Private &amp; Group</p>
    </div>

    <!-- ── Auth Card ──────────────────────────────────── -->
    <div class="auth-card">

      <!-- Tabs -->
      <div class="auth-tabs">
        <button id="loginTab" class="tab-btn active" type="button"
          onclick="showLogin()">Sign In</button>
        <button id="registerTab" class="tab-btn" type="button"
          onclick="showRegister()">Register</button>
      </div>

      <!-- ── Login Form ──────────────────────────────── -->
      <form id="loginForm" class="auth-form"
        onsubmit="event.preventDefault(); login();">

        <div class="field-group">
          <label for="loginUsername">Username</label>
          <input
            type="text"
            id="loginUsername"
            placeholder="Enter your username"
            autocomplete="username"
            spellcheck="false"
            required>
        </div>

        <div class="field-group">
          <label for="loginPassword">Password</label>
          <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            required>
        </div>

        <div id="loginMessage" class="auth-message"></div>

        <button id="loginButton" class="auth-submit" type="submit">
          Sign In
        </button>

      </form>

      <!-- ── Register Form ───────────────────────────── -->
      <form id="registerForm" class="auth-form hidden"
        onsubmit="event.preventDefault(); registerUser();">

        <div class="field-group">
          <label for="registerUsername">Choose Username</label>
          <input
            type="text"
            id="registerUsername"
            placeholder="Pick a unique username"
            autocomplete="username"
            spellcheck="false"
            required>
        </div>

        <div class="field-group">
          <label for="registerPassword">Create Password</label>
          <input
            type="password"
            id="registerPassword"
            placeholder="Create a strong password"
            autocomplete="new-password"
            required>
        </div>

        <div id="registerMessage" class="auth-message"></div>

        <button id="registerButton" class="auth-submit" type="submit">
          Create Account
        </button>

      </form>

    </div><!-- /.auth-card -->

    <!-- ── Footer note ────────────────────────────────── -->
    <p class="auth-footer">
      <span class="lock-icon">🔒</span>
      Messages encrypted with RSA + AES
    </p>

  </div><!-- /.auth-container -->


  <!-- ── Toast ──────────────────────────────────────────── -->
  <div id="toast" class="toast">
    <span id="toastIcon">✓</span>
    <span id="toastMessage">Success</span>
  </div>

  <script src="/static/script.js"></script>
</body>

</html>
